<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>リアルタイム時計</title>
  <style>
    :root{color-scheme:dark;--bg:#090d17;--text:#f3f7ff;--muted:#98a8c1;--accent:#70e4d1}
    *{box-sizing:border-box}
    .video-bg{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}
    .video-shade{position:fixed;inset:0;background:linear-gradient(180deg,#070b17a8,#050a14a8);z-index:1;pointer-events:none}
    body{isolation:isolate;margin:0;min-height:100svh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 50% 35%,#1b2a43 0%,var(--bg) 68%);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text)}
    main{position:relative;z-index:2;width:min(100%,850px);padding:clamp(24px,6vw,60px);text-align:center;border:1px solid #ffffff20;border-radius:30px;background:#ffffff08;box-shadow:0 24px 80px #0007;backdrop-filter:blur(3px)}
    .eyebrow{font-size:13px;letter-spacing:.24em;color:var(--accent);font-weight:700}
    h1{font-size:clamp(16px,3vw,22px);font-weight:500;color:var(--muted);margin:18px 0 30px}
    .clock{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";font-weight:750;font-size:clamp(49px,10vw,112px);line-height:1.1;letter-spacing:-.055em;white-space:nowrap}
    #milliseconds{font-size:.32em;letter-spacing:0;color:var(--accent);vertical-align:baseline}
    .date{margin-top:23px;font-size:clamp(16px,2.5vw,23px);color:#d4dfee}
    .zone{margin-top:12px;font-size:14px;color:var(--muted)}
    .progress{height:4px;width:100%;background:#ffffff18;border-radius:5px;overflow:hidden;margin-top:34px}
    .progress>div{height:100%;width:0;background:linear-gradient(90deg,#62d6db,#94f3b6);will-change:width}
    .controls{margin-top:25px;display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap}
    button{color:var(--text);background:#ffffff10;border:1px solid #ffffff30;border-radius:100px;padding:10px 18px;font:inherit;cursor:pointer}
    button:hover{background:#ffffff20}button[aria-pressed=true]{border-color:var(--accent);color:var(--accent)}
    .hint{font-size:12px;color:var(--muted);margin-top:22px}
    @media(max-width:480px){main{padding:28px 15px}.clock{font-size:clamp(42px,10vw,60px)}}
  </style>
</head>
<body>
<video class="video-bg" id="bgVideo" autoplay muted loop playsinline preload="auto" aria-hidden="true"><source src="background.mp4" type="video/mp4"></video>
<div class="video-shade" aria-hidden="true"></div>
<main>
  <div class="eyebrow">LIVE CLOCK</div>
  <h1>現在の日本時間</h1>
  <div class="clock" role="timer" aria-label="現在時刻"><span id="time">--:--:--</span><span id="milliseconds" hidden>.000</span></div>
  <div class="date" id="date">----年--月--日</div>
  <div class="zone">JST · Asia/Tokyo (UTC+09:00)</div>
  <div class="progress" aria-hidden="true"><div id="progress"></div></div>
  <div class="controls"><button id="toggleMs" type="button" aria-pressed="false">ミリ秒を表示</button><button id="toggleHour" type="button" aria-pressed="false">12時間表示</button></div>
  <div class="hint" id="status">背景動画：読み込み中…</div>
</main>
<script>
(() => {
  'use strict';
  const timeEl = document.getElementById('time');
  const msEl = document.getElementById('milliseconds');
  const dateEl = document.getElementById('date');
  const progressEl = document.getElementById('progress');
  const msBtn = document.getElementById('toggleMs');
  const hourBtn = document.getElementById('toggleHour');
  const zone = 'Asia/Tokyo';
  let showMs = false, hour12 = false, lastDate = '';
  const two = n => String(n).padStart(2, '0');
  const partsFormat = new Intl.DateTimeFormat('en-US', {timeZone:zone,year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'});
  const dateFormat = new Intl.DateTimeFormat('ja-JP', {timeZone:zone,year:'numeric',month:'long',day:'numeric',weekday:'long'});
  function render(){
    const now = new Date();
    const p = Object.fromEntries(partsFormat.formatToParts(now).filter(x => x.type !== 'literal').map(x => [x.type,x.value]));
    const h = Number(p.hour);
    timeEl.textContent = `${two(hour12 ? (h % 12 || 12) : h)}:${p.minute}:${p.second}`;
    if(showMs) msEl.textContent = '.' + String(now.getMilliseconds()).padStart(3,'0');
    progressEl.style.width = `${(Number(p.second) + now.getMilliseconds()/1000)/60*100}%`;
    const dateKey = `${p.year}-${p.month}-${p.day}`;
    if(dateKey !== lastDate){dateEl.textContent = dateFormat.format(now);lastDate = dateKey;}
    requestAnimationFrame(render);
  }
  msBtn.addEventListener('click', () => {showMs = !showMs;msEl.hidden = !showMs;msBtn.textContent = showMs ? 'ミリ秒を非表示' : 'ミリ秒を表示';msBtn.setAttribute('aria-pressed',String(showMs));});
  hourBtn.addEventListener('click', () => {hour12 = !hour12;hourBtn.textContent = hour12 ? '24時間表示' : '12時間表示';hourBtn.setAttribute('aria-pressed',String(hour12));});
  const bgVideo = document.getElementById('bgVideo');
  bgVideo.muted = true;
  bgVideo.defaultMuted = true;
  bgVideo.volume = 0;
  const status = document.getElementById('status');
  const tryPlay = () => {
    if (bgVideo.error) return;
    const result = bgVideo.play();
    if (result && result.catch) result.catch(() => {
      status.textContent = '動画再生がブロックされました。画面をクリックすると再試行します。';
    });
  };
  bgVideo.addEventListener('playing', () => {status.textContent = '背景動画：無音でループ再生中';});
  bgVideo.addEventListener('error', () => {status.textContent = '背景動画を読み込めません。background.mp4 をHTMLと同じフォルダに置いてください。';});
  bgVideo.addEventListener('stalled', () => {status.textContent = '背景動画を読み込み中…';});
  document.addEventListener('visibilitychange', () => {if (!document.hidden) tryPlay();});
  document.addEventListener('pointerdown', tryPlay);
  tryPlay();
  render();
})();
</script>
</body>
</html>
