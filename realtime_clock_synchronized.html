<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>時刻同期 MP3 時計</title><style>
*{box-sizing:border-box}body{margin:0;background:#080f1b;color:#e8f4ff;font:16px system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}video{position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;pointer-events:none}.veil{position:fixed;inset:0;background:#050b16c7;z-index:1}main{position:relative;z-index:2;width:min(760px,calc(100% - 24px));margin:20px auto;padding:28px;background:#0b1830df;border:1px solid #ffffff30;border-radius:23px;box-shadow:0 15px 70px #0009}h1{font-size:15px;color:#6be8d7;letter-spacing:.12em;text-align:center}.clock{text-align:center;font-size:clamp(44px,10vw,82px);font-weight:800;font-variant-numeric:tabular-nums}.clock small{font-size:.30em;color:#6be8d7}.date{text-align:center;color:#adbed0;margin-bottom:28px}section{margin-top:18px;padding:18px;border-radius:13px;background:#0a1325b5;border:1px solid #ffffff1b}h2{font-size:16px;margin:0 0 14px}label{display:block;color:#adc4d6;font-size:14px;margin:10px 0 5px}input[type=file]{width:100%;max-width:100%;color:#fff}input[type=number]{width:74px}input{background:#101f38;border:1px solid #53667d;color:#fff;border-radius:8px;padding:8px;font:inherit}input[type=range]{width:100%;padding:0;accent-color:#67e5d5}button{padding:11px 15px;background:#2c7d77;color:white;border:0;border-radius:10px;font-weight:700;cursor:pointer}button.secondary{background:#32445a}button:disabled{opacity:.45;cursor:not-allowed}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}.times{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.note{font-size:13px;color:#b8cadb;line-height:1.65}#status{white-space:pre-wrap;color:#8ff3df;min-height:42px}audio{width:100%;margin-top:12px}.headline{font-variant-numeric:tabular-nums;color:#fff;font-size:18px;font-weight:700}#videoState{font-size:12px;color:#c8c8d1}</style></head><body>
<video id="bg" src="background.mp4" autoplay muted loop playsinline preload="metadata"></video><div class="veil"></div><main><h1>JST · REALTIME CLOCK</h1><div class="clock"><span id="clock">--:--:--</span><small id="ms">.000</small></div><div class="date" id="date"></div>
<section><h2>① MP3ファイル</h2><label for="file">MP3を選択（手動で選択すれば確実に指定ファイルを使用）</label><input type="file" id="file" accept="audio/mpeg,.mp3,audio/*"><p class="note" id="loaded">同じフォルダの music.mp3 を自動読み込みします。読み込めない場合は上のボタンで選択してください。</p><audio id="audio" src="music.mp3" controls preload="auto"></audio></section>
<section><h2>② 同期させる時刻</h2><div class="times"><input aria-label="時" id="h" type="number" min="0" max="23" value="11"> 時 <input aria-label="分" id="m" type="number" min="0" max="59" value="0"> 分 <input aria-label="秒" id="s" type="number" min="0" max="59" value="0"> 秒</div><label>その時刻に流れていてほしい曲の位置</label><div class="times"><input aria-label="曲の分" id="pm" type="number" min="0" max="999" value="1"> 分 <input aria-label="曲の秒" id="ps" type="number" min="0" max="59" value="30"> 秒</div><input type="range" id="pos" min="0" max="300" step="1" value="90"><p class="note">バーは曲の「同期ポイント」指定用。バー操作だけでは途中へスキップしません。</p><p>開始予定：<span class="headline" id="start">--:--:--</span> → 目標：<span class="headline" id="target">11:00:00</span></p><div class="buttons"><button id="arm">この設定で予約する</button><button class="secondary" id="cancel">予約取消・停止</button></div><p id="status" role="status">MP3の読み込みを確認してください。</p></section>
<p class="note">※予約時のクリックで音声再生を許可してください。タブを開いたまま、PCをスリープさせないでください。ブラウザの省電力設定などによって音声開始がずれる場合があります。</p><p id="videoState"></p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id), audio=$('audio');let fileURL=null,armed=false,startMs=0,targetMs=0,startTimer=null,started=false,anchorMs=0,lastDay='';const pad=n=>String(n).padStart(2,'0');const jstParts=t=>{const d=new Date(t+32400000);return [d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate(),d.getUTCHours(),d.getUTCMinutes(),d.getUTCSeconds()]};const n=(id,max)=>Math.max(0,Math.min(max,Number($(id).value)||0));const fmt=t=>{const p=jstParts(t);return `${pad(p[3])}:${pad(p[4])}:${pad(p[5])}`};const point=()=>n('pm',999)*60+n('ps',59);
function schedule(){const p=jstParts(Date.now()),day=Date.UTC(p[0],p[1],p[2])-32400000;let goal=day+(n('h',23)*3600+n('m',59)*60+n('s',59))*1000, start=goal-point()*1000;if(start<Date.now()+250){goal+=86400000;start+=86400000;}return{goal,start};}
function render(){let sc=schedule();$('start').textContent=fmt(sc.start);$('target').textContent=fmt(sc.goal);$('pos').value=Math.min(Number($('pos').max),point());}
function disarm(msg){armed=false;started=false;if(startTimer){clearTimeout(startTimer);startTimer=null}audio.pause();if(msg)$('status').textContent=msg;}
function ready(){return audio.readyState>=1&&Number.isFinite(audio.duration)&&audio.duration>0}
function audioLoaded(){if(ready()){$('loaded').textContent=`MP3読み込み済み（${Math.floor(audio.duration/60)}分${Math.floor(audio.duration%60)}秒）`; $('pos').max=String(Math.floor(audio.duration));render();$('status').textContent='MP3の読み込み完了。同期予約できます。';}else $('loaded').textContent='MP3を読み込めませんでした。上からMP3ファイルを選択してください。';}
$('file').addEventListener('change',e=>{disarm();if(fileURL)URL.revokeObjectURL(fileURL);const f=e.target.files[0];if(!f)return;fileURL=URL.createObjectURL(f);audio.src=fileURL;audio.load();$('loaded').textContent=`${f.name} を読み込み中…`;});audio.addEventListener('loadedmetadata',audioLoaded);audio.addEventListener('error',()=>{$('loaded').textContent='音声読み込みエラー。MP3を手動で選択してください。';$('status').textContent='MP3を選択してから予約してください。';});
for(const id of ['h','m','s','pm','ps'])$(id).addEventListener('input',()=>{if(armed)disarm('設定を変更したため予約を解除しました。');render()});$('pos').addEventListener('input',()=>{let v=Number($('pos').value);$('pm').value=Math.floor(v/60);$('ps').value=v%60;if(armed)disarm('同期ポイント変更により予約を解除しました。');render();});
async function begin(){if(!armed||started)return;started=true;try{audio.currentTime=Math.max(0,(Date.now()-startMs)/1000);await audio.play();anchorMs=Date.now();$('status').textContent='音声再生中（時刻同期）';}catch(err){disarm('再生できません：'+err.message+'。再度予約を押して音声再生を許可してください。');}}
$('arm').addEventListener('click',async()=>{if(!ready()){audio.load();$('status').textContent='MP3が未準備です。「MP3を選択」からファイルを選んでください。';return;}if(point()>audio.duration){$('status').textContent='同期ポイントが曲の長さを超えています。';return;}disarm();const sc=schedule();startMs=sc.start;targetMs=sc.goal;audio.currentTime=0;try{// ユーザー操作中に音声再生を許可させて即停止
await audio.play();audio.pause();audio.currentTime=0;}catch(err){$('status').textContent='音声の再生許可が必要です：'+err.message;return;}armed=true;started=false;$('status').textContent=`予約完了：${fmt(startMs)} に曲の先頭から再生します。`;if(startMs-Date.now()<100)begin();else startTimer=setTimeout(begin,Math.max(0,startMs-Date.now()));});
$('cancel').addEventListener('click',()=>disarm('予約を取り消し、音声を停止しました。'));
function tick(){const now=Date.now(),p=jstParts(now);$('clock').textContent=`${pad(p[3])}:${pad(p[4])}:${pad(p[5])}`;$('ms').textContent='.'+String(now%1000).padStart(3,'0');const day=p.slice(0,3).join('-');if(day!==lastDay){$('date').textContent=new Intl.DateTimeFormat('ja-JP',{timeZone:'Asia/Tokyo',dateStyle:'full'}).format(now);lastDay=day;}
if(armed&&!started&&now>=startMs)begin();if(armed&&started&&!audio.paused){const expected=(now-startMs)/1000,drift=expected-audio.currentTime;if(Math.abs(drift)>.2&&expected>=0&&expected<audio.duration){audio.currentTime=expected;}$('status').textContent=`再生中：${Math.floor(audio.currentTime/60)}:${pad(Math.floor(audio.currentTime%60))} / 目標時刻 ${fmt(targetMs)} で ${Math.floor(point()/60)}:${pad(point()%60)} 地点`;}}
setInterval(tick,70);const bg=$('bg');bg.muted=true;bg.play().catch(()=>{$('videoState').textContent='背景動画が再生されない場合は画面をクリックしてください。';});document.addEventListener('click',()=>{if(bg.paused)bg.play().catch(()=>{});});bg.addEventListener('error',()=>{$('videoState').textContent='背景動画がない場合は暗い背景で表示します。';});render();tick();})();
</script></body></html>
